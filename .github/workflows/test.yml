name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # T36 пункт 1: НАСТОЯЩИЙ PostgreSQL — одноразовый, только для прогона.
    # Нужен шагу «SQL через настоящий PostgreSQL» ниже И живому контуру
    # tests/pg/ (пункт 2 T36: первая сюита переведена 03.09.2026). У pytest
    # СВОЯ база aocg_pytest — шаг sql_check обязан получить ПУСТУЮ
    # aocg_sqlcheck, его прибор «развёртывание с нуля» иначе слепнет.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aocg_sqlcheck
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: База для pytest (отдельная от sql_check)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE aocg_pytest'

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aocg_pytest
        run: pytest tests/ -v

      # Ловит класс, невидимый для FakePool: опечатка в имени колонки,
      # переименованная таблица, битый синтаксис. Такая ошибка иначе
      # проявляется только на проде, а битый DDL в init_db роняет старт
      # контейнера целиком. Схема поднимается на ПУСТОЙ одноразовой базе.
      - name: SQL через настоящий PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aocg_sqlcheck
          JWT_SECRET_KEY: ci-only-not-a-secret
        run: python tests/tools/sql_check.py --schema

      # Опись боевых настроек не должна устареть молча (S-49).
      # Ловит: код читает переменную, которой нет в описи, — и наоборот.
      - name: Опись боевых настроек против кода
        run: python scripts/check_env_opis.py

      - name: Lint with ruff
        run: ruff check app/
