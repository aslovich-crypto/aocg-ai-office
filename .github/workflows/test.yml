name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # T36 пункт 1: НАСТОЯЩИЙ PostgreSQL — одноразовый, только для прогона.
    # Нужен шагу «SQL через настоящий PostgreSQL» ниже; сами тесты по-прежнему
    # идут на FakePool (полный переход — пункт 2 задачи T36).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aocg_sqlcheck
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      # Ловит класс, невидимый для FakePool: опечатка в имени колонки,
      # переименованная таблица, битый синтаксис. Такая ошибка иначе
      # проявляется только на проде, а битый DDL в init_db роняет старт
      # контейнера целиком. Схема поднимается на ПУСТОЙ одноразовой базе.
      - name: SQL через настоящий PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aocg_sqlcheck
          JWT_SECRET_KEY: ci-only-not-a-secret
        run: python tests/tools/sql_check.py --schema

      - name: Lint with ruff
        run: ruff check app/
