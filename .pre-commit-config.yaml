repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # ЮРИДИЧЕСКИЕ ДОКУМЕНТЫ ИЗ docs/AOCG-LEGAL-* ИСКЛЮЧЕНЫ намеренно.
      # Это не наш код, а присланные юристом файлы: их текст читается
      # приложением и замораживается в журнале согласий. 07.08.2026 хук
      # молча срезал в них markdown-переносы (двойной пробел в конце
      # строки) — 8 символов в согласии и 45 в политике; сторож версий
      # тут же покраснел, потому что хеши перестали сходиться. Автоправка
      # входящего документа недопустима: файл обязан остаться таким, каким
      # его прислали.
      #
      # ВТОРОЕ ИСКЛЮЧЕНИЕ — tests/fixtures/sigv4/: ВЕНДОРНАЯ КОПИЯ
      # контрольных примеров AWS (aws4_testsuite). Проверка подписи
      # сравнивает файлы ПОБАЙТНО, и один добавленный перевод строки
      # ломает её целиком. Поймано в тот же день, 12.08.2026: хук
      # дописал \n в 16 файлов, и 12 тестов подписи покраснели на ровном
      # месте. Файл поставщика не правится автоматикой — как и документы
      # юриста выше, это ЧУЖОЙ артефакт с известным заранее ответом.
      - id: trailing-whitespace
        exclude: ^(docs/AOCG-LEGAL-.*\.md|tests/fixtures/sigv4/.*)$
      - id: end-of-file-fixer
        exclude: ^(docs/AOCG-LEGAL-.*\.md|tests/fixtures/sigv4/.*)$
      - id: check-added-large-files
        args: ['--maxkb=5120']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ⚠️ СТОРОЖ ТРЕКЕРА — РЕЖИМ ПРЕДУПРЕЖДЕНИЯ, НЕ БЛОКИРОВКИ.
  # Он всегда возвращает 0 и только печатает расхождения. Блокировать коммит
  # правкой трекера нельзя: человек научится обходить хук через --no-verify,
  # и тогда потеряется ВЕСЬ сторож, а не одна проверка. Предупреждение видно
  # в выводе и не мешает.
  #
  # Заведён 27.08.2026 по замеру: за три дня ТРИ задачи (T61, T62, T66)
  # стояли ⬜ будучи сделанными, а правило журнала «вписывать факт тем же
  # коммитом» не исполнялось ни разу. Чинить надо было не дисциплину,
  # а отсутствие проверки.
  - repo: local
    hooks:
      - id: tracker-guard
        name: сторож трекера (предупреждение, не блокировка)
        entry: ./venv/bin/python tests/tools/tracker_guard.py
        language: system
        files: ^docs/TASKS\.md$
        pass_filenames: false
        verbose: true

      # ⚠️ СВЕРКА БЛОКА ПОРЯДКА С ФАКТОМ — ОТДЕЛЬНЫМ ХУКОМ, И ЗАВЕДЕНА ОНА
      # ПОТОМУ, ЧТО ПРИБОР БЕЗ ЗАПУСКА НЕ ПРИБОР. Замер 08.09.2026:
      # `tracker_html_guard.py` не запускался НИЧЕМ — ни pytest, ни хуком,
      # ни CI; его гоняли руками, когда вспоминали. Правило «зачёркивать тем
      # же коммитом» переехало бы из «держится на добросовестности» в
      # «держится на том, что кто-то вспомнит запустить сторожа» — то есть
      # никуда. Поймано на себе через час после того, как это же записали
      # четырнадцатым наблюдением 13а.18.
      # ПРЕДУПРЕЖДЕНИЕ, А НЕ БЛОКИРОВКА — по действующему доводу соседнего
      # хука: блокировка на трекере учит обходить хук, и тогда теряется весь
      # сторож, а не одна проверка. Отсюда `|| true`.
      # Цена замерена: 0.37 с на прогон.
      - id: tracker-order-guard
        name: блок порядка против факта (предупреждение, не блокировка)
        entry: bash -c './venv/bin/python tests/tools/tracker_html_guard.py || true'
        language: system
        files: ^docs/TASKS\.md$
        pass_filenames: false
        verbose: true

      # ⚠️ ОЧЕРЕДЬ (T199 ③): две 🔵, отступление без записи в журнале, битая
      # запись журнала. Здесь — предупреждение, по доводу соседних хуков;
      # КРАСНОЕ — в CI (`tests/test_tracker_queue.py`).
      - id: tracker-queue-guard
        name: очередь — одна в работе, отступление только с записью (предупреждение, не блокировка)
        entry: bash -c './venv/bin/python tests/tools/tracker_queue.py || true'
        language: system
        files: ^docs/TASKS\.md$
        pass_filenames: false
        verbose: true

      # ⚠️ О6 (T199 ③): кодовый коммит, а в блоке «▶ ПОРЯДОК» ни одной 🔵 — работа
      # идёт мимо очереди. Закрывает названную слепоту CI наполовину: видит коммит
      # без объявленной работы, но не видит коммит про ДРУГУЮ задачу. Предупреждение.
      - id: tracker-queue-no-work
        name: кодовый коммит без пункта в работе (предупреждение, не блокировка)
        entry: bash -c './venv/bin/python tests/tools/tracker_queue.py --pre-commit "$@" || true' --
        language: system
        files: ^(app|scripts|tests)/
        pass_filenames: true
        verbose: true

      # ⚠️ ВХОД В ТРЕКЕР — НОВАЯ СТРОКА ТОЛЬКО ПО РЕШЕНИЮ ВЛАДЕЛЬЦА (T199 ①,
      # решение владельца 22.09.2026, Р3). Здесь — предупреждение, по доводу
      # соседних хуков: блокировка на трекере учит обходить хук. КРАСНОЕ —
      # в CI (`tests/test_tracker_entry.py`). Предупреждение печатается ярко,
      # и агент ОБЯЗАН назвать его в отчёте о коммите дословно: молчаливое
      # предупреждение равно отсутствию. Срабатывает и на правку списков —
      # подмена замороженного списка видна сразу, а не в CI.
      - id: tracker-entry-guard
        name: вход в трекер — строка только по решению владельца (предупреждение, не блокировка)
        entry: bash -c './venv/bin/python tests/tools/tracker_entry_guard.py || true'
        language: system
        files: ^(docs/TASKS\.md|tests/tools/fixtures/tracker_ids_[a-z]+\.txt)$
        pass_filenames: false
        verbose: true
